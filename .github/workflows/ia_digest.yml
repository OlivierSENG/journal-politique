name: IA Digest

on:
  # Planificateur quotidien — 8:00 UTC = 9h00 Paris (hiver, UTC+1)
  # En été (UTC+2): ça sera 10h00 Paris — ajuster en décembre 2026 à 7:00 UTC
  schedule:
    - cron: "0 8 * * *"



jobs:
  ia-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 resend

      - name: Générer résumé IA + envoi email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: arfalan1337@gmail.com
        run: |
          python ia_digest.py \
            --to "$TO_EMAIL" \
            --api-key "$RESEND_API_KEY" \
            --emetteur onboarding@resend.dev
